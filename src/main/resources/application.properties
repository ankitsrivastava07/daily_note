spring.application.name=notes
server.port=9091

# Database Configuration
# Node IP addresses or hostnames (comma-separated)
spring.cassandra.contact-points=127.0.0.1:9042

# Target Cassandra keyspace name
spring.cassandra.keyspace-name=my_keyspace

# Name of the local data center (Required by DataStax Java Driver 4.x+)
spring.cassandra.local-datacenter=datacenter1

# Database Credentials
spring.cassandra.username=cassandra
spring.cassandra.password=cassandra

# Schema Action (none, create, create-if-not-exists, recreate, recreate-drop-unused)
spring.cassandra.schema-action=create-if-not-exists

# Connection Timeouts
spring.cassandra.connection.connect-timeout=5s
spring.cassandra.connection.init-query-timeout=5s
